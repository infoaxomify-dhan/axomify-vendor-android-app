name: Build Axomify Rider APK

# WHY THIS FILE EXISTS: the sandbox this app was built in cannot reach
# Google's Android SDK download servers (network-restricted), so an actual
# installable .apk could not be produced there -- only the source code.
# This workflow lets GitHub's OWN free cloud runners do that one remaining
# step: every time you push to this repo (or click "Run workflow" below),
# GitHub spins up a fresh Ubuntu machine, installs the Android SDK itself,
# and builds the APK -- completely free for a public or private repo on a
# personal GitHub account, no Android Studio needed on your own computer.
#
# HOW TO GET THE BUILT APK:
# 1. Push this whole project to a new GitHub repository (see README.md).
# 2. Go to the repo's "Actions" tab on github.com -- this workflow runs
#    automatically on every push, or click "Run workflow" to trigger it
#    manually.
# 3. Once it finishes (green check, a few minutes), open that run and
#    scroll down to "Artifacts" -- download "axomify-rider-debug-apk".
#    That zip contains app-debug.apk -- copy it to the rider's phone and
#    tap it to install (Android will ask to allow "install from this
#    source" once, since it isn't from the Play Store).
#
# Before this will produce a WORKING app (not just one that builds):
# replace app/google-services.json with your real downloaded file first
# (see README.md's Firebase setup steps) -- otherwise it builds fine but
# can't actually receive push notifications.
#
# v1.3.0 (2026-10-19) -- this workflow now ALSO tries to build a SIGNED
# RELEASE apk (axomify-rider-release-apk), using a stable signing key kept
# only as encrypted GitHub repository Secrets (never committed to this
# repo). See README.md's "Stable signing key (one-time setup)" section for
# exactly how to generate/add those secrets. Every step involved in that is
# marked continue-on-error: true, and still runs even if an earlier one of
# them failed (if: always()) -- so forgetting to set these secrets up, or a
# problem with them, can NEVER break the existing debug-APK build above,
# which keeps working exactly as it always has either way.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Python (for icon/splash asset generation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install Pillow

      # v1.2.0 (2026-10-19) -- self-service icon/splash update: if
      # app/branding/icon_source.png and/or app/branding/splash_source.png
      # exist, this regenerates every Android resource file that image
      # drives (all 5 mipmap density folders + the splash logo) BEFORE
      # Gradle compiles, so changing the app's look is just "replace one
      # file in app/branding/ and push" -- no more manually generating or
      # uploading files into multiple mipmap folders by hand. Safe no-op
      # if app/branding/ is empty -- see scripts/generate_icon_assets.py
      # for the full explanation.
      - name: Generate icon/splash assets (if app/branding/ has source images)
        run: python scripts/generate_icon_assets.py

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: axomify-rider-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      # --- v1.3.0 signed release build (optional, never blocks the debug build above) ---

      - name: Decode release keystore (only if the AXOMIFY_KEYSTORE_BASE64 secret is set)
        if: always()
        continue-on-error: true
        env:
          AXOMIFY_KEYSTORE_BASE64: ${{ secrets.AXOMIFY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AXOMIFY_KEYSTORE_BASE64" ]; then
            echo "$AXOMIFY_KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
            echo "Keystore decoded -- will attempt a signed release build."
          else
            echo "AXOMIFY_KEYSTORE_BASE64 secret not set yet -- skipping the signed release build (debug build above is unaffected)."
          fi

      - name: Build signed release APK (only if the keystore secrets are set)
        if: always()
        continue-on-error: true
        env:
          AXOMIFY_KEYSTORE_PATH: release-keystore.jks
          AXOMIFY_KEYSTORE_PASSWORD: ${{ secrets.AXOMIFY_KEYSTORE_PASSWORD }}
          AXOMIFY_KEY_ALIAS: ${{ secrets.AXOMIFY_KEY_ALIAS }}
          AXOMIFY_KEY_PASSWORD: ${{ secrets.AXOMIFY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload signed release APK (if it was built)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: axomify-rider-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          if-no-files-found: warn
